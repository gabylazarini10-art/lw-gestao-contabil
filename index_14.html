<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LW Gestão Contábil</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Inter',sans-serif;
    background:linear-gradient(150deg,#241457 0%,#4B2A9E 55%,#2AAFA5 130%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .wrap{background:#fff;border-radius:20px;padding:40px 34px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(20,10,50,.35);text-align:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;color:#241457;margin:0 0 4px;}
  .tagline{font-size:11px;letter-spacing:2px;color:#A9A2BC;text-transform:uppercase;margin:0 0 30px;}
  a.btn{
    display:block;text-decoration:none;padding:16px;border-radius:12px;margin-bottom:14px;
    font-weight:600;font-size:15px;transition:transform .1s;
  }
  a.btn:active{transform:scale(.98);}
  .btn-principal{background:#241457;color:#fff;}
  .btn-cliente{background:#E6F7F5;color:#1D8A82;}
  .btn small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:3px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>LW Gestão Contábil</h1>
    <p class="tagline">Organização · Estratégia · Resultados</p>
    <a class="btn btn-principal" href="LW_Sistema_Contabil_1.html">
      Sistema Contábil
      <small>Acesso da contadora</small>
    </a>
    <a class="btn btn-cliente" href="LW_App_Cliente.html">
      Meu Financeiro
      <small>Acesso do cliente</small>
    </a>
  </div>
</body>
</html>
